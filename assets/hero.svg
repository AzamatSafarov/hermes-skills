<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="hermes-skills — agent skills for research, writing and repository craft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0d15"/>
      <stop offset="0.55" stop-color="#15111f"/>
      <stop offset="1" stop-color="#1b1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2340" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#c4b5fd" font-size="17" letter-spacing="3.4" font-weight="600">HERMES AGENT · SKILL COLLECTION</text>
    <text x="70" y="176" fill="#f5f3ff" font-size="58" font-weight="700">hermes-skills</text>
    <text x="72" y="220" fill="#a79fc4" font-size="21">Two skills that insist on evidence: repository presentation, and schemas grounded in the text.</text>

    <g font-size="15" font-weight="600">
      <rect x="72" y="254" width="292" height="38" rx="19" fill="none" stroke="#4c3a7a"/>
      <text x="92" y="278" fill="#d8cffb">github-repo-beautifier</text>

      <rect x="384" y="254" width="322" height="38" rx="19" fill="none" stroke="#4c3a7a"/>
      <text x="404" y="278" fill="#d8cffb">concept-schema-visualizer</text>

      <rect x="726" y="254" width="176" height="38" rx="19" fill="none" stroke="#3d3457"/>
      <text x="746" y="278" fill="#8f87a8">MIT · SKILL.md</text>
    </g>
  </g>

  <g transform="translate(1010 132)" fill="none" stroke="url(#accent)" stroke-width="2">
    <rect x="0" y="0" width="96" height="64" rx="10"/>
    <rect x="16" y="18" width="64" height="6" rx="3" fill="#8b5cf6" stroke="none"/>
    <rect x="16" y="32" width="44" height="5" rx="2.5" fill="#5b4b8a" stroke="none"/>
    <rect x="16" y="44" width="54" height="5" rx="2.5" fill="#5b4b8a" stroke="none"/>
  </g>
</svg>
